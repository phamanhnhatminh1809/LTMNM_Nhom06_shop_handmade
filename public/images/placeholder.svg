<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8" />
      <stop offset="100%" stop-color="#F3ECE7" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#792A16" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#cardBg)" />
  <rect x="12" y="12" width="376" height="376" rx="16" fill="none" stroke="#E6DAD3" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Center Decorative Circle -->
  <circle cx="200" cy="170" r="64" fill="#FFFFFF" filter="url(#subtleShadow)" />
  <circle cx="200" cy="170" r="64" fill="none" stroke="#EFE5E0" stroke-width="2" />

  <!-- Artisanal Craft / Yarn / Gift Icon (Terracotta & Mocha) -->
  <g transform="translate(164, 134)" fill="none" stroke="#792A16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera / Frame / Craft Motif -->
    <rect x="4" y="10" width="64" height="52" rx="10" stroke="#792A16" stroke-width="2.5" fill="#FAF5F2" fill-opacity="0.5" />
    <circle cx="36" cy="36" r="15" stroke="#792A16" stroke-width="2.5" />
    <circle cx="36" cy="36" r="6" fill="#792A16" fill-opacity="0.3" stroke="none" />
    <path d="M22 10 L28 4 L44 4 L50 10" stroke="#792A16" stroke-width="2.2" />
    
    <!-- Little Sparkle / Handmade Star -->
    <path d="M56 18 L58 14 L62 16 L58 18 L56 22 L54 18 L50 16 L54 14 Z" fill="#D97706" stroke="none" />
  </g>

  <!-- Brand Typography -->
  <text x="200" y="270" text-anchor="middle" font-family="'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#792A16" letter-spacing="0.5">Shop Handmade</text>
  <text x="200" y="295" text-anchor="middle" font-family="'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#89726D">Hình ảnh đang được cập nhật</text>
</svg>
