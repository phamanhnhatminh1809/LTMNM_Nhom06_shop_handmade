services:
  # App Service: Laravel CLI & Artisan Server
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ltmnm_shop_handmade_app
    restart: no
    working_dir: /var/www/html
    ports:
      - "8000:8000"                      # Laravel App: http://localhost:8000
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ltmnm_shop_handmade
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PHP_CLI_SERVER_WORKERS: 4
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
      - redis
    networks:
      - app_network
    stdin_open: true
    tty: true

  # Web Service: Apache HTTP Server serving Laravel Public
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ltmnm_shop_handmade_web
    restart: no
    ports:
      - "8080:80"                      # Truy cập web qua Apache: http://localhost:8080
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ltmnm_shop_handmade
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_CONFIG_CACHE: /tmp/laravel-cache/config.php
      APP_ROUTES_CACHE: /tmp/laravel-cache/routes-v7.php
      APP_EVENTS_CACHE: /tmp/laravel-cache/events.php
      VIEW_COMPILED_PATH: /tmp/laravel-views
    depends_on:
      - db
      - redis
    networks:
      - app_network

  # Redis Service: Lưu Session & Cache trên RAM
  redis:
    image: redis:7-alpine
    container_name: ltmnm_shop_handmade_redis
    restart: no
    networks:
      - app_network

  # Database Service: MySQL 8.0
  db:
    image: mysql:8.0
    container_name: ltmnm_shop_handmade_mysql_db
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ltmnm_shop_handmade
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

volumes:
  db_data:
  vendor_data:

networks:
  app_network:
    driver: bridge
