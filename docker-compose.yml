services:
  # App Service: Laravel CLI & Artisan Server
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ltmnm_shop_handmade_app
    restart: no
    working_dir: /var/www/html
    ports:
      - "8000:8000"                      # Laravel App: http://localhost:8000
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ltmnm_shop_handmade
      DB_USERNAME: root
      DB_PASSWORD: root
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    networks:
      - app_network
    stdin_open: true
    tty: true

  # Web Service: Apache HTTP Server serving Laravel Public
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ltmnm_shop_handmade_web
    restart: no
    ports:
      - "8080:80"                      # Truy cập web qua Apache: http://localhost:8080
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ltmnm_shop_handmade
      DB_USERNAME: root
      DB_PASSWORD: root
    command: >
      bash -c "sed -ri -e 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/*.conf &&
               sed -ri -e 's!/var/www/!/var/www/html/public!g' /etc/apache2/apache2.conf /etc/apache2/conf-available/*.conf &&
               apache2-foreground"
    depends_on:
      - db
    networks:
      - app_network

  # Database Service: MySQL 8.0
  db:
    image: mysql:8.0
    container_name: ltmnm_shop_handmade_mysql_db
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ltmnm_shop_handmade
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge